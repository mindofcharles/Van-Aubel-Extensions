name: Repository checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean
          auto-config: false
          build: true
          build-args: --wfail
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Check the public umbrella module
        working-directory: lean
        run: lake env lean -t 0 VanAubelExtensions.lean

  numerical:
    name: Numerical consistency checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: verify/requirements.txt

      - name: Install numerical dependencies
        run: python -m pip install --requirement verify/requirements.txt

      - name: Run deterministic boundary checks
        run: python -m unittest discover --start-directory verify --pattern "test_*.py"

      - name: Run the consistency checks
        run: python verify/verify_van_aubel.py
